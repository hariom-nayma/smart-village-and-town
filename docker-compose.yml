version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: svtf-postgres
    restart: always
    environment:
      POSTGRES_DB: smart_village_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_village_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svtf-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_village_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      APP_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APP_STORAGE_TYPE: local
      APP_STORAGE_UPLOAD_DIR: /app/uploads
      APP_STORAGE_BASE_URL: http://localhost:8080/uploads
    ports:
      - "8080:8080"
    volumes:
      - app_uploads:/app/uploads

volumes:
  pgdata:
  app_uploads:
